<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Anton';   src: url('../fonts/Anton-Regular.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'DM Sans'; src: url('../fonts/DMSans.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; width: 1024px; height: 500px; background: #0D1117; color: #F5ECD7; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; }
  .card { position: relative; width: 1024px; height: 500px; padding: 56px 64px; box-sizing: border-box; display: flex; align-items: center; gap: 40px; }
  .grid { position: absolute; inset: 0; opacity: .07; background-image: linear-gradient(#2A3547 1px, transparent 1px), linear-gradient(90deg, #2A3547 1px, transparent 1px); background-size: 48px 48px; }
  .badge { position: relative; width: 168px; height: 168px; border-radius: 36px; overflow: hidden; flex: 0 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .badge img { width: 100%; height: 100%; display: block; }
  h1 { position: relative; font-family: 'Anton', Impact, sans-serif; text-transform: uppercase; font-size: 92px; line-height: .92; margin: 0; letter-spacing: .01em; }
  h1 .red { color: #C8322C; }
  .sub { position: relative; font-size: 24px; color: rgba(245,236,215,.85); margin: 16px 0 0; max-width: 26ch; line-height: 1.3; }
  .dots { position: absolute; right: 64px; bottom: 44px; display: flex; gap: 10px; } .dots span { width: 16px; height: 16px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="badge"><img src="../icon-512.png" alt="" /></div>
    <div>
      <h1 id="h">The playbook<br/>for <span class="red">showing up.</span></h1>
      <p class="sub" id="s">The cycle-aware coach for guys who want to be a better partner.</p>
    </div>
    <div class="dots"><span style="background:#C8322C"></span><span style="background:#3DAA6A"></span><span style="background:#E8B84B"></span><span style="background:#7B68B8"></span></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('lang') === 'no') {
      document.getElementById('h').innerHTML = 'Spilleboka<br/>for å <span class="red">stille opp.</span>';
      document.getElementById('s').textContent = 'Den syklusbevisste coachen for gutter som vil bli en bedre partner.';
    }
  </script>
</body>
</html>
