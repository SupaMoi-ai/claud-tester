function shareUrl() { return location.origin + location.pathname.replace(/[^/]*$/, ''); }
function openShare()  { setState({ showShare: true,  showShareQR: false, copiedAt: 0 }); }
function closeShare() { setState({ showShare: false, showShareQR: false }); }
function toggleShareQR() { setState({ showShareQR: !state.showShareQR }); }
async function nativeShare() {
  if (!navigator.share) return;
  try {
    await navigator.share({
      title: 'BRO CODE',
      text: 'The playbook for showing up. Cycle-aware moves for guys who want to be a better partner.',
      url: shareUrl()
    });
  } catch (e) { /* user cancelled */ }
}
async function copyShareLink() {
  const url = shareUrl();
  try {
    await navigator.clipboard.writeText(url);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
  }
  setState({ copiedAt: Date.now() });
  setTimeout(() => { if (state.showShare) render(); }, 2100);
}

let saveTimer = null;
function flashSaved() {
  const el = $('#save-status');
  if (!el) return;
  el.textContent = '✓ SAVED';
  el.classList.add('saved');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(() => {
    if (el) { el.textContent = '// auto-save on'; el.classList.remove('saved'); }
  }, 1400);
}
function debouncedSave(p) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!p.lastPeriod) return;
    state.profile = saveProfile(p) || state.profile;
    flashSaved();
  }, 500);
}
function updateField(e) {
  const field = e.target.dataset.field;
  let value = e.target.value;
  if (field === 'cycleLength') value = Math.max(21, Math.min(35, parseInt(value) || 28));
  const next = { ...(state.profile || {}), [field]: value };
  state.profile = next;
  debouncedSave(next);
}
function updateDate(which, e) {
  const value = e.target.value || '';
  const prev = state.profile || {};
  const dates = { ...(prev.dates || {}), [which]: value };
  const next = { ...prev, dates };
  state.profile = next;
  debouncedSave(next);
  // Re-render so the dashboard COMING UP card reflects the change immediately
  render();
}
function togglePill(key, id, multi) {
  const p = state.profile || {};
  let next;
  if (multi) {
    const arr = Array.isArray(p[key]) ? p[key].slice() : [];
    const i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1); else arr.push(id);
    next = { ...p, [key]: arr };
  } else {
    next = { ...p, [key]: p[key] === id ? '' : id };
  }
  state.profile = next;
  debouncedSave(next);
  render();
}
function exportProfile() {
  if (!state.profile) return;
  const blob = new Blob([JSON.stringify(state.profile, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `brocode-profile-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}
function importProfile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.lastPeriod) throw new Error('No lastPeriod field.');
      data.cycleLength = clampCycleLength(data.cycleLength);
      const saved = saveProfile(data);
      if (!saved) throw new Error('Storage blocked.');
      state.profile = saved;
      render();
      showToast('Profile imported.', 'success');
    } catch (err) { showToast('Import failed: ' + err.message, 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function confirmClear() {
  if (confirm('Clear her profile? This cannot be undone.')) {
    clearProfile();
    state.profile = null;
    render();
  }
}

// ---------- NOTIFICATIONS ----------
// ---------- NOTIFICATIONS (gentle, 3 slots, max 3 / day, 7am–9pm) ----------
const SLOT_HOURS = { morning: 8, midday: 13, evening: 18 };
const SLOT_LABEL = { morning: 'morning', midday: 'midday', evening: 'tonight' };
const NOTIF_DAY_CAP = 3;

function anyNotifOn() {
  return !!(state.notifSlots && (state.notifSlots.morning || state.notifSlots.midday || state.notifSlots.evening));
}

async function requestNotifPermission() {
  haptic(8);
  if (typeof Notification === 'undefined') {
    showToast('Install the app to your home screen first, then enable reminders.', 'error');
    dismissNotifNudge();
    return;
  }
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  try { localStorage.setItem('brocode_notif_nudged', '1'); } catch {}
  if (perm === 'granted') {
    try { localStorage.setItem(NOTIF_KEY, '1'); } catch {}
    setState({ notifNudged: true, notifEnabled: true });
    scheduleAllSlots();
  } else {
    setState({ notifNudged: true });
  }
}
function dismissNotifNudge() {
  haptic(6);
  try { localStorage.setItem('brocode_notif_nudged', '1'); } catch {}
  setState({ notifNudged: true });
}
function shouldShowNotifNudge() {
  if (state.notifNudged) return false;
  if (!state.profile?.lastPeriod) return false;
  if (typeof Notification === 'undefined') return false;
  if (Notification.permission === 'granted') return false;
  const s = state.notifSlots || {};
  return !!(s.morning || s.midday || s.evening);
}
function renderNotifNudge() {
  if (!shouldShowNotifNudge()) return '';
  return `
    <div class="card" style="border-left:3px solid var(--orange)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0;flex:1">
          <div class="label">// reminders are on</div>
          <p style="margin:6px 0 0;color:var(--cream);line-height:1.45;font-size:14px">Allow notifications so the daily nudge actually reaches you. Gentle, max 3 a day, only when there's something worth saying.</p>
          <button class="btn btn-primary" style="padding:8px 14px;font-size:12px;margin-top:8px" onclick="requestNotifPermission()">ALLOW NOTIFICATIONS</button>
        </div>
        <button class="x" onclick="dismissNotifNudge()" aria-label="Later" style="background:none;border:0;color:rgba(245,236,215,0.55);font-size:20px;cursor:pointer;padding:0 4px;flex:0 0 auto">×</button>
      </div>
    </div>
  `;
}

async function toggleNotifSlot(slot) {
  if (!['morning','midday','evening'].includes(slot)) return;
  if (typeof Notification === 'undefined') {
    showToast('Install the app to your home screen first, then enable reminders.', 'error');
    return;
  }
  const slots = { ...(state.notifSlots || {}) };
  if (slots[slot]) {
    slots[slot] = false;
    try { localStorage.setItem('brocode_notif_' + slot, '0'); } catch {}
    setState({ notifSlots: slots });
    return;
  }
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    showToast('Enable notifications in your browser settings to receive reminders.', 'error');
    return;
  }
  slots[slot] = true;
  try {
    localStorage.setItem('brocode_notif_' + slot, '1');
    // Keep legacy NOTIF_KEY in sync so other paths don't get confused
    localStorage.setItem(NOTIF_KEY, '1');
  } catch {}
  setState({ notifSlots: slots, notifEnabled: true });
  scheduleAllSlots();
}

function notifCountKey() {
  return 'brocode_notif_count_' + new Date().toISOString().slice(0, 10);
}
function getDayCount() {
  try { return parseInt(localStorage.getItem(notifCountKey()) || '0', 10); } catch { return 0; }
}
function bumpDayCount() {
  try { localStorage.setItem(notifCountKey(), String(getDayCount() + 1)); } catch {}
}
function lastFiredKey(slot) {
  return 'brocode_slot_last_' + slot;
}
function inQuietHours() {
  const h = new Date().getHours();
  return h < 7 || h >= 21;
}

function notifBodyForSlot(slot) {
  const p = state.profile;
  if (!p?.lastPeriod) return null;
  const day = cycleDay(p);
  const len = p.cycleLength || 28;
  const phase = phaseFor(day, len);
  const phaseLower = (PHASE_LABEL[phase] || '').toLowerCase();

  // Cross-cutting: event today/tomorrow always wins in any slot
  const soon = upcomingEvents(p, 1);
  if (soon.length) {
    const e = soon[0];
    const label = e.label.toLowerCase();
    if (e.daysUntil === 0) {
      return { title: 'BRO CODE · ' + e.emoji + ' today', body: `${label} today. open the app — one play inside if you want.` };
    }
    if (e.daysUntil === 1) {
      return { title: 'BRO CODE · ' + e.emoji + ' tomorrow', body: `${label} tomorrow. one play inside if you want.` };
    }
  }

  if (slot === 'morning') {
    // Always fires when enabled. Phase-aware brief, gentle.
    const tip = lowerSoftly(fillName(pickTip(p, phase, dayInPhase(day, len)) || 'show up today, no agenda.'));
    return { title: 'BRO CODE · ' + phaseLower + ' d' + day, body: tip };
  }

  if (slot === 'midday') {
    // Only fires when there's actual signal.
    const pulse = computePulse();
    if (pulse?.kind === 'repair') {
      return { title: 'BRO CODE · quick check', body: `you logged a conflict ${pulse.daysAgo} day${pulse.daysAgo === 1 ? '' : 's'} ago. one move when you're back.` };
    }
    if (pulse?.kind === 'ghost') {
      const d = pulse.daysSince || 5;
      return { title: 'BRO CODE · quiet days', body: `${d} quiet days. small thing tonight goes a long way.` };
    }
    if (pulse?.kind === 'channel') {
      return { title: 'BRO CODE · switch the channel', body: `lots of gifts lately. tonight maybe attention beats stuff.` };
    }
    const upWk = upcomingEvents(p, 7).find(e => e.daysUntil >= 2);
    if (upWk) {
      return { title: 'BRO CODE · ' + upWk.emoji + ' ' + upWk.daysUntil + ' days', body: `${upWk.label.toLowerCase()} in ${upWk.daysUntil} days. plays inside if you want one.` };
    }
    const trans = nextPhaseTransition(day, len);
    if (trans && trans.daysAway === 1) {
      return { title: 'BRO CODE · heads up', body: `${PHASE_LABEL[trans.next].toLowerCase()} tomorrow. nothing to do — just a soft note.` };
    }
    return null; // silent today
  }

  if (slot === 'evening') {
    // Only fires when nothing logged today.
    if (loggedToday && loggedToday()) return null;
    const moves = {
      menstrual:  'one small thing tonight — heating pad, no agenda.',
      follicular: 'one small thing tonight — a tiny plan suggestion.',
      ovulation:  'one small thing tonight — 20 minutes, eyes up.',
      luteal:     'one small thing tonight — 20 quiet minutes, no phone.'
    };
    return { title: 'BRO CODE · tonight', body: moves[phase] || 'one small thing tonight.' };
  }

  return null;
}

function lowerSoftly(s) {
  if (!s) return '';
  // Tame BRO/CAPS/exclamation, keep proper names like "Maya" intact.
  return String(s)
    .replace(/!+/g, '.')
    .replace(/^[Bb]rooo+,?\s*/g, '')
    .replace(/^[Bb]ro listen[\s—\-]*/i, '')
    .replace(/^[Bb]ro,?\s*/g, '')
    .replace(/^[Pp]sst bro[\s—\-]*/g, '')
    .replace(/^[Rr]eal talk bro,?\s*/g, '')
    .replace(/^./, c => c.toLowerCase());
}

function fireSlot(slot) {
  if (!state.notifSlots?.[slot]) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if (getDayCount() >= NOTIF_DAY_CAP) return;
  if (inQuietHours()) return;
  const today = new Date().toISOString().slice(0,10);
  const lastFired = localStorage.getItem(lastFiredKey(slot));
  if (lastFired === today) return;  // already fired this slot today
  const out = notifBodyForSlot(slot);
  if (!out) return;  // nothing worth saying
  try {
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(out.title, {
        body: out.body, icon: 'icon-192.png', badge: 'icon-192.png',
        tag: 'brocode-' + slot + '-' + today, silent: false
      }));
    } else {
      new Notification(out.title, { body: out.body, icon: 'icon-192.png', tag: 'brocode-' + slot + '-' + today });
    }
    try { localStorage.setItem(lastFiredKey(slot), today); } catch {}
    bumpDayCount();
    // Keep legacy NOTIF_LAST in sync for any code that still checks it
    try { localStorage.setItem(NOTIF_LAST, today); } catch {}
  } catch {}
}

function scheduleAllSlots() {
  if (!anyNotifOn()) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  for (const slot of ['morning','midday','evening']) {
    if (!state.notifSlots[slot]) continue;
    const hour = SLOT_HOURS[slot];
    const target = new Date(now); target.setHours(hour, 0, 0, 0);
    const today = now.toISOString().slice(0,10);
    const alreadyFired = localStorage.getItem(lastFiredKey(slot)) === today;
    if (!alreadyFired && now >= target && !inQuietHours()) {
      try { fireSlot(slot); } catch {}
    } else if (!alreadyFired) {
      const delay = Math.max(1000, target - now);
      setTimeout(() => { try { fireSlot(slot); } catch {} }, delay);
    }
  }
  // Re-arm tomorrow at 7am
  const next = new Date(now); next.setDate(next.getDate() + 1); next.setHours(7, 0, 0, 0);
  setTimeout(scheduleAllSlots, Math.max(60 * 1000, next - now));
}

// Back-compat shim — anything still calling these gets the new behavior.
function scheduleNotification() { scheduleAllSlots(); }
function fireNotification() { ['morning','midday','evening'].forEach(s => { if (state.notifSlots?.[s]) fireSlot(s); }); }
function notifBody() { return notifBodyForSlot('morning') || { title: 'BRO CODE', body: '' }; }
async function toggleNotif() { return toggleNotifSlot('morning'); }

// ---------- INSTALL HINT ----------
function detectInstallHint() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isSafari = isIOS && /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && isSafari && !standalone && localStorage.getItem(INSTALL_DISMISS) !== '1') {
    state.showInstallHint = true;
  }
}
function dismissInstallHint() {
  localStorage.setItem(INSTALL_DISMISS, '1');
  setState({ showInstallHint: false });
}

// ---------- ONLINE / OFFLINE ----------
function applyOnlineStatus() {
  const pill = document.getElementById('offline-pill');
  if (!pill) return;
  pill.classList.toggle('on', !navigator.onLine);
}
window.addEventListener('online',  applyOnlineStatus);
window.addEventListener('offline', applyOnlineStatus);

// Escape closes whatever overlay is up, celebration first.
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ((state.celebrateQueue || []).length) { dismissCelebration(); return; }
  if (state.showShare) { closeShare(); return; }
});

// ---------- UPDATE PROMPT ----------
function applyUpdate() { window.location.reload(); }
function dismissUpdate() { setState({ updateReady: false }); }

// ---------- PWA ----------
// Skip the service worker inside a native (Capacitor) shell — assets are bundled there already.
if ('serviceWorker' in navigator && !window.Capacitor) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (!reg) return;
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            setState({ updateReady: true });
          }
        });
      });
    }).catch(()=>{});
  });
}

// ---------- INSTALL PROMPT ----------
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.installPrompt = e;
  render();
});
window.addEventListener('appinstalled', () => {
  state.installPrompt = null;
  state.installDismissed = true;
  render();
});

function triggerInstall() {
  haptic(10);
  const p = state.installPrompt;
  if (p && typeof p.prompt === 'function') {
    p.prompt();
    p.userChoice?.then(() => { state.installPrompt = null; render(); });
  } else {
    // iOS / unsupported: show the manual hint
    showToast('Tap the Share icon → "Add to Home Screen" to install.', 'success');
  }
}
function dismissInstall() {
  haptic(6);
  try { localStorage.setItem('brocode_install_dismissed', String(Date.now())); } catch {}
  setState({ installDismissed: true });
}
function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches
        || (typeof navigator !== 'undefined' && navigator.standalone === true);
  } catch { return false; }
}
function isIOSSafari() {
  const ua = navigator.userAgent || '';
  return /iPhone|iPad|iPod/i.test(ua) && !/CriOS|FxiOS|EdgiOS/i.test(ua);
}
function installPlatform() {
  if (isStandalone()) return 'installed';
  if (state.installPrompt) return 'native';
  if (isIOSSafari()) return 'ios';
  return 'manual';
}
function shouldShowInstallBanner() {
  if (state.installDismissed) return false;
  if (isStandalone()) return false;
  if (!state.profile?.lastPeriod) return false;  // wait until onboarded
  // Show if we have a real install prompt (Chrome) OR iOS Safari (manual) after enough engagement
  if (state.installPrompt) return state.visits >= 2;
  if (isIOSSafari()) return state.visits >= 3;
  return false;
}
function dismissMethodHint() {
  haptic(6);
  try { localStorage.setItem('brocode_method_hinted', '1'); } catch {}
  setState({});
}
function shouldShowMethodHint() {
  if (localStorage.getItem('brocode_method_hinted') === '1') return false;
  const p = state.profile;
  if (!p?.lastPeriod) return false;
  if (p.contraception) return false;  // already set
  return true;
}
function renderMethodHint() {
  if (!shouldShowMethodHint()) return '';
  return `
    <div class="card" style="border-left:3px solid var(--orange)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0;flex:1">
          <div class="label">// her method</div>
          <p style="margin:6px 0 0;color:var(--cream);line-height:1.45;font-size:14px">Set what she's using in profile → it changes how the cycle reads. Takes ten seconds.</p>
          <button class="btn btn-ghost" style="padding:6px 12px;font-size:11px;margin-top:8px" onclick="go('profile')">→ HER PROFILE</button>
        </div>
        <button class="x" onclick="dismissMethodHint()" aria-label="Later" style="background:none;border:0;color:rgba(245,236,215,0.55);font-size:20px;cursor:pointer;padding:0 4px;flex:0 0 auto">×</button>
      </div>
    </div>
  `;
}

function renderInstallBanner() {
  if (!shouldShowInstallBanner()) return '';
  const ios = !state.installPrompt && isIOSSafari();
  const cta = ios
    ? `<span class="label" style="color:rgba(245,236,215,0.7);font-size:11px;display:block;margin-top:8px">Tap <strong>Share</strong> → <strong>Add to Home Screen</strong></span>`
    : `<button class="btn btn-primary" style="padding:8px 14px;font-size:12px;margin-top:8px" onclick="triggerInstall()">+ ADD TO HOME SCREEN</button>`;
  return `
    <div class="card install-banner" style="border-left:3px solid var(--orange)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0;flex:1">
          <div class="label">// install :: only works if it's on your home screen</div>
          <p style="margin:6px 0 0;color:var(--cream);line-height:1.45;font-size:14px">Push reminders and the badge need the installed app. One tap.</p>
          ${cta}
        </div>
        <button class="x" onclick="dismissInstall()" aria-label="Later" style="background:none;border:0;color:rgba(245,236,215,0.55);font-size:20px;cursor:pointer;padding:0 4px;flex:0 0 auto">×</button>
      </div>
    </div>
  `;
}

// ---------- BOOT ----------
detectInstallHint();
render();
applyOnlineStatus();
if (anyNotifOn()) scheduleAllSlots();
setInterval(tickActivity, 60000);
